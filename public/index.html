<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThlongPremium — Blox Fruit Tracker</title>
<style>
:root {
  --bg:#070512; --bg2:#0c0920; --bg3:#120e2a; --card:#100d1e; --card-h:#161229;
  --bord:#251b42; --bord-h:#7c3aed; --pur:#9333ea; --pur-l:#a855f7; --pur-d:#6b21a8;
  --acc:#c084fc; --txt:#e2d9f3; --txt-d:#9985c5; --txt-m:#4e4270;
  --grn:#4ade80; --red:#f87171; --yel:#fbbf24; --blu:#60a5fa; --teal:#2dd4bf;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0b0620,#110840);border-bottom:1px solid var(--bord);
  padding:18px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-ic{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--pur),var(--acc));
  display:flex;align-items:center;justify-content:center;font-size:22px;}
.logo-t{font-size:19px;font-weight:800;background:linear-gradient(135deg,var(--pur-l),var(--acc));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-s{font-size:10px;color:var(--txt-m);letter-spacing:2px;text-transform:uppercase;}
.hdr-r{display:flex;align-items:center;gap:14px;}
.live-dot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt-m);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grn);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;}
.btn-pur{background:var(--pur);color:#fff;}
.btn-pur:hover{background:var(--pur-l);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--txt-d);border:1px solid var(--bord);}
.btn-ghost:hover{background:var(--bg3);color:var(--txt);}

/* SUMBAR */
.sumbar{background:var(--bg2);border-bottom:1px solid var(--bord);padding:14px 32px;display:flex;gap:40px;overflow-x:auto;}
.si{display:flex;flex-direction:column;gap:2px;white-space:nowrap;}
.si-l{font-size:10px;color:var(--txt-m);text-transform:uppercase;letter-spacing:1px;}
.si-v{font-size:22px;font-weight:800;color:var(--acc);}

/* MAIN */
.main{padding:26px 32px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.sec-title{font-size:15px;font-weight:700;}
.cnt{background:var(--bg3);border:1px solid var(--bord);color:var(--txt-d);padding:3px 12px;border-radius:20px;font-size:12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}

/* CARD */
.card{background:var(--card);border:1px solid var(--bord);border-radius:16px;overflow:hidden;
  transition:all .25s;cursor:pointer;}
.card:hover{border-color:var(--bord-h);background:var(--card-h);transform:translateY(-2px);
  box-shadow:0 8px 36px rgba(147,51,234,.18);}
.card-accent{height:3px;background:linear-gradient(90deg,var(--pur),var(--acc));}
.card-hdr{padding:14px 15px 10px;display:flex;align-items:flex-start;justify-content:space-between;}
.ident{display:flex;align-items:flex-start;gap:11px;}
.av{width:42px;height:42px;flex-shrink:0;border-radius:50%;
  background:linear-gradient(135deg,var(--pur-d),var(--pur));
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;}
.uname{font-size:14px;font-weight:700;}
.dname{font-size:11px;color:var(--txt-m);margin-top:1px;}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.badge{padding:2px 7px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;}
.b-s1{background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.3);}
.b-s2{background:rgba(96,165,250,.12);color:#60a5fa;border:1px solid rgba(96,165,250,.3);}
.b-s3{background:rgba(192,132,252,.12);color:#c084fc;border:1px solid rgba(192,132,252,.3);}
.b-race{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.3);}
.lv-block{text-align:right;flex-shrink:0;}
.lv-num{font-size:28px;font-weight:900;color:var(--acc);line-height:1;}
.lv-lbl{font-size:9px;color:var(--txt-m);text-transform:uppercase;letter-spacing:1px;}
.del-btn{background:transparent;border:none;cursor:pointer;color:var(--txt-m);font-size:13px;
  padding:3px 6px;border-radius:6px;transition:.2s;display:block;margin-bottom:2px;}
.del-btn:hover{background:rgba(248,113,113,.12);color:var(--red);}

/* level bar */
.lv-bar-wrap{padding:0 15px 10px;}
.lv-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.lv-fill{height:100%;background:linear-gradient(90deg,var(--pur),var(--acc));border-radius:2px;transition:width .5s;}

/* card quick info */
.qrow{padding:10px 15px;border-top:1px solid var(--bord);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.fi{font-size:16px;}
.fn{font-size:13px;font-weight:600;}
.fn-none{color:var(--txt-m);font-style:italic;}
.cur-mini{display:flex;gap:12px;padding:10px 15px;border-top:1px solid var(--bord);}
.cm{display:flex;flex-direction:column;}
.cm-v{font-size:13px;font-weight:700;}
.cm-l{font-size:10px;color:var(--txt-m);}
.tap-hint{padding:8px 15px;border-top:1px solid var(--bord);font-size:11px;color:var(--txt-m);
  display:flex;align-items:center;gap:5px;}
.online-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grn);
  margin-left:4px;vertical-align:middle;animation:pulse 2s infinite;}

/* EMPTY / LOADER */
.empty{text-align:center;padding:80px 20px;color:var(--txt-m);}
.empty-ic{font-size:52px;margin-bottom:14px;opacity:.4;}
.empty-t{font-size:18px;color:var(--txt-d);margin-bottom:6px;}
.loader{text-align:center;padding:60px;color:var(--txt-m);}
.spin{width:30px;height:30px;border:3px solid var(--bg3);border-top-color:var(--pur);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* DETAIL MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(7,5,18,.9);z-index:200;
  align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
.overlay.open{display:flex;}
.detail{background:var(--card);border:1px solid var(--bord);border-radius:18px;
  width:100%;max-width:560px;overflow:hidden;margin:auto;}
.detail-hdr{background:linear-gradient(135deg,#0f0a28,#1a0f3a);padding:20px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.detail-ident{display:flex;align-items:center;gap:12px;}
.detail-av{width:52px;height:52px;flex-shrink:0;border-radius:50%;
  background:linear-gradient(135deg,var(--pur-d),var(--pur));
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;}
.detail-uname{font-size:17px;font-weight:800;}
.detail-sub{font-size:12px;color:var(--txt-m);margin-top:2px;}
.detail-lv{text-align:right;flex-shrink:0;}
.detail-lv-num{font-size:36px;font-weight:900;color:var(--acc);line-height:1;}
.detail-lv-lbl{font-size:10px;color:var(--txt-m);text-transform:uppercase;}
.close-btn{background:var(--bg3);border:none;color:var(--txt-d);width:32px;height:32px;
  border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:.2s;}
.close-btn:hover{background:var(--bord);color:var(--txt);}

/* detail sections */
.dsec{padding:14px 18px;border-top:1px solid var(--bord);}
.dsec-t{font-size:10px;color:var(--txt-m);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}

/* stat bars (detail) */
.srow{display:grid;grid-template-columns:72px 1fr 48px;align-items:center;gap:8px;margin-bottom:5px;}
.sn{font-size:10px;color:var(--txt-m);text-transform:uppercase;}
.track{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.fill{height:100%;border-radius:3px;transition:width .5s;}
.f-mel{background:linear-gradient(90deg,#f87171,#fca5a5);}
.f-def{background:linear-gradient(90deg,#60a5fa,#93c5fd);}
.f-swd{background:linear-gradient(90deg,#4ade80,#86efac);}
.f-gun{background:linear-gradient(90deg,#fbbf24,#fde68a);}
.f-fru{background:linear-gradient(90deg,#c084fc,#e9d5ff);}
.sv{font-size:11px;color:var(--txt-d);text-align:right;font-variant-numeric:tabular-nums;}

/* currency */
.cur-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.ci{background:var(--bg3);border-radius:8px;padding:9px 10px;text-align:center;}
.ca{font-size:14px;font-weight:800;}
.cl{font-size:10px;color:var(--txt-m);text-transform:uppercase;margin-top:2px;}

/* raw data grid */
.raw-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.raw-row{background:var(--bg3);border-radius:7px;padding:7px 10px;display:flex;
  flex-direction:column;gap:2px;}
.raw-key{font-size:10px;color:var(--txt-m);text-transform:uppercase;letter-spacing:.3px;}
.raw-val{font-size:12px;font-weight:600;word-break:break-all;}

/* DELETE MODAL */
.dmodal{background:var(--card);border:1px solid var(--bord);border-radius:16px;
  padding:24px;width:380px;max-width:92vw;margin:auto;}
.dmodal-t{font-size:16px;font-weight:800;margin-bottom:10px;}
.dmodal-sub{font-size:13px;color:var(--txt-d);margin-bottom:14px;line-height:1.5;}
.dmodal input{width:100%;background:var(--bg);border:1px solid var(--bord);border-radius:8px;
  padding:10px 14px;color:var(--txt);font-size:14px;margin-bottom:14px;outline:none;}
.dmodal input:focus{border-color:var(--pur);}
.dmodal-btns{display:flex;gap:10px;justify-content:flex-end;}
.btn-danger{background:#dc2626;color:#fff;}
.btn-danger:hover{background:#ef4444;}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--bg3);border:1px solid var(--bord);
  border-left:3px solid var(--pur);border-radius:10px;padding:11px 18px;font-size:13px;color:var(--txt);
  opacity:0;transform:translateX(14px);transition:all .3s;z-index:400;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(0);}

@media(max-width:640px){
  .hdr,.sumbar,.main{padding-left:14px;padding-right:14px;}
  .grid{grid-template-columns:1fr;}
  .sumbar{gap:20px;flex-wrap:wrap;}
  .hdr{flex-wrap:wrap;gap:10px;}
  .raw-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-ic">🍎</div>
    <div>
      <div class="logo-t">ThlongPremium</div>
      <div class="logo-s">Blox Fruit Tracker</div>
    </div>
  </div>
  <div class="hdr-r">
    <div class="live-dot"><div class="dot"></div><span id="lastSync">Đang tải...</span></div>
    <button class="btn btn-pur" onclick="load()">↻ Refresh</button>
  </div>
</header>

<div class="sumbar">
  <div class="si"><div class="si-l">Tổng ACC</div><div class="si-v" id="s-total">0</div></div>
  <div class="si"><div class="si-l">Online</div><div class="si-v" id="s-online" style="color:var(--grn)">0</div></div>
  <div class="si"><div class="si-l">Level Cao Nhất</div><div class="si-v" id="s-maxlv">0</div></div>
  <div class="si"><div class="si-l">Tổng Beli</div><div class="si-v" id="s-beli" style="color:var(--yel)">0</div></div>
  <div class="si"><div class="si-l">Tổng Fragment</div><div class="si-v" id="s-frag" style="color:var(--acc)">0</div></div>
</div>

<main class="main">
  <div class="sec-hdr">
    <div class="sec-title">Accounts</div>
    <span class="cnt" id="cnt-lbl">0 acc</span>
  </div>
  <div id="container"><div class="loader"><div class="spin"></div>Đang tải dữ liệu...</div></div>
</main>

<!-- DETAIL MODAL -->
<div class="overlay" id="detail-modal" onclick="if(event.target===this)closeDetail()">
  <div class="detail" id="detail-content"></div>
</div>

<!-- DELETE MODAL -->
<div class="overlay" id="del-modal">
  <div class="dmodal">
    <div class="dmodal-t">🗑️ Xóa Account</div>
    <div class="dmodal-sub">Nhập API Secret để xóa <strong id="del-name" style="color:var(--acc)"></strong>.</div>
    <input type="password" id="del-key" placeholder="API Secret (mặc định: ThlongPremium2024)" />
    <div class="dmodal-btns">
      <button class="btn btn-ghost" onclick="closeDel()">Hủy</button>
      <button class="btn btn-danger" onclick="doDelete()">Xóa</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MAX_LV = 2800;
const SEA = {1:"🌊 First Sea",2:"🌏 Second Sea",3:"⚓ Third Sea"};
const SEA_CLS = {1:"b-s1",2:"b-s2",3:"b-s3"};
const FRUIT_MAP = {
  smoke:"💨",spike:"🌵",flame:"🔥",falcon:"🦅",ice:"🧊",sand:"🏜️",dark:"🌑",revive:"💚",
  diamond:"💎",light:"✨",rubber:"🏐",barrier:"🛡️",magma:"🌋",quake:"💥",buddha:"🧘",
  string:"🕸️",phoenix:"🔴",rumble:"⚡",paw:"🐾",gravity:"🌀",mammoth:"🦣","t-rex":"🦖",
  spirit:"👻",leopard:"🐆",kitsune:"🦊",venom:"☠️",control:"🎮",portal:"🔮",shadow:"🌙",
  blizzard:"❄️",dragon:"🐉",soul:"💫",dough:"🫓",bomb:"💣",rocket:"🚀",human:"👊",love:"❤️",
  bird:"🦤",spring:"🌀",chop:"🔪",spin:"🌪️",swim:"🐟",
};

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = n => { n=Number(n)||0; if(n>=1e9)return(n/1e9).toFixed(1)+"B"; if(n>=1e6)return(n/1e6).toFixed(1)+"M"; if(n>=1e3)return(n/1e3).toFixed(1)+"K"; return n.toLocaleString("vi-VN"); };
const ago = iso => { if(!iso)return"Chưa sync"; const m=Math.floor((Date.now()-new Date(iso))/60000); if(m<1)return"vừa xong"; if(m<60)return m+" phút trước"; const h=Math.floor(m/60); if(h<24)return h+" giờ trước"; return Math.floor(h/24)+" ngày trước"; };
const isOnline = iso => iso && (Date.now()-new Date(iso)) < 3*60*1000;
const fi = name => { if(!name||name==="None")return"❌"; const n=name.toLowerCase(); for(const[k,v]of Object.entries(FRUIT_MAP))if(n.includes(k))return v; return"🍎"; };

const g  = (obj,...keys) => { for(const k of keys){const v=obj[k]; if(v!==undefined&&v!==null)return Number(v)||0;} return 0; };
const gs = (obj,...keys) => { for(const k of keys){const v=obj[k]; if(v!==undefined&&v!==null&&v!=="")return String(v);} return""; };

// level từ nhiều nguồn, ưu tiên giá trị > 1
function getLevel(acc) {
  const candidates = [
    g(acc,"level","Level"),
    g(acc.raw_dump||{},"Level","Lvl"),
  ].filter(v=>v>0);
  return candidates.length ? Math.max(...candidates) : 0;
}

let allAccounts = [];
let _delKey = null;

// ── CARD ──
function card(acc) {
  const user  = esc(gs(acc,"username","Username")||"???");
  const lv    = getLevel(acc);
  const sea   = g(acc,"sea","Sea")||1;
  const race  = esc(gs(acc,"race","Race")||"Human");
  const fruit = gs(acc,"devil_fruit","DevilFruit","FruitName")||"None";
  const beli  = g(acc,"beli","Beli");
  const frag  = g(acc,"fragments","Fragments");
  const bnty  = g(acc,"bounty","Bounty");
  const honor = g(acc,"honor","Honor");
  const key   = esc(acc.account_key||user);
  const on    = isOnline(acc.last_updated);
  const lvPct = Math.min((lv/MAX_LV)*100,100).toFixed(1);
  const currency3rd = sea>=3;

  return `
<div class="card" onclick="openDetail('${key}')">
  <div class="card-accent"></div>
  <div class="card-hdr">
    <div class="ident">
      <div class="av">${user.charAt(0).toUpperCase()}</div>
      <div>
        <div class="uname">${user}${on?'<span class="online-dot"></span>':""}</div>
        <div class="badges">
          <span class="badge ${SEA_CLS[sea]||"b-s1"}">${SEA[sea]||"Sea "+sea}</span>
          <span class="badge b-race">👤 ${race}</span>
        </div>
      </div>
    </div>
    <div class="lv-block">
      <button class="del-btn" onclick="event.stopPropagation();openDel('${key}','${user}')">🗑️</button>
      <div class="lv-num">${lv}</div>
      <div class="lv-lbl">LEVEL</div>
    </div>
  </div>
  <div class="lv-bar-wrap">
    <div class="lv-track" title="${lv}/${MAX_LV}">
      <div class="lv-fill" style="width:${lvPct}%"></div>
    </div>
  </div>
  <div class="qrow">
    <span class="fi">${fi(fruit)}</span>
    <span class="fn${fruit==="None"?" fn-none":""}">${esc(fruit)}</span>
  </div>
  <div class="cur-mini">
    <div class="cm"><div class="cm-v" style="color:var(--yel)">${fmt(beli)}</div><div class="cm-l">💰 Beli</div></div>
    <div class="cm"><div class="cm-v" style="color:var(--acc)">${fmt(frag)}</div><div class="cm-l">💜 Fragment</div></div>
    <div class="cm"><div class="cm-v" style="color:${currency3rd?"var(--blu)":"var(--grn)"}">${fmt(currency3rd?honor:bnty)}</div><div class="cm-l">${currency3rd?"⚔️ Honor":"🏴 Bounty"}</div></div>
  </div>
  <div class="tap-hint">👆 Nhấn để xem chi tiết • 🕐 ${ago(acc.last_updated)}</div>
</div>`;
}

// ── DETAIL MODAL ──
function openDetail(key) {
  const acc = allAccounts.find(a=>(a.account_key||"")===key);
  if(!acc) return;

  const user   = esc(gs(acc,"username","Username")||"???");
  const dname  = esc(gs(acc,"display_name","displayName")||user);
  const lv     = getLevel(acc);
  const sea    = g(acc,"sea","Sea")||1;
  const race   = esc(gs(acc,"race","Race")||"Human");
  const fruit  = gs(acc,"devil_fruit","DevilFruit","FruitName")||"None";
  const beli   = g(acc,"beli","Beli");
  const frag   = g(acc,"fragments","Fragments");
  const bnty   = g(acc,"bounty","Bounty");
  const honor  = g(acc,"honor","Honor");
  const on     = isOnline(acc.last_updated);
  const c3rd   = sea>=3;
  const lvPct  = Math.min((lv/MAX_LV)*100,100).toFixed(1);

  const stats = {
    MELEE:   g(acc,"stat_melee","Melee"),
    DEFENSE: g(acc,"stat_defense","Defense"),
    SWORD:   g(acc,"stat_sword","Sword"),
    GUN:     g(acc,"stat_gun","Gun"),
    FRUIT:   g(acc,"stat_fruit","Fruit"),
  };
  const totalSt = Object.values(stats).reduce((a,b)=>a+b,0)||1;
  const stCls = {MELEE:"f-mel",DEFENSE:"f-def",SWORD:"f-swd",GUN:"f-gun",FRUIT:"f-fru"};
  const statRows = Object.entries(stats).map(([n,v])=>`
    <div class="srow">
      <span class="sn">${n}</span>
      <div class="track"><div class="fill ${stCls[n]}" style="width:${Math.round(v/totalSt*100)}%"></div></div>
      <span class="sv">${v}</span>
    </div>`).join("");

  // Raw dump — loại bỏ trùng và field lớn
  const skip = new Set(["raw_dump","account_key","last_updated","username","display_name",
    "user_id","level","beli","bounty","honor","fragments","stat_melee","stat_defense",
    "stat_sword","stat_gun","stat_fruit","race","devil_fruit","sea"]);
  const raw = acc.raw_dump||{};
  const entries = Object.entries(raw)
    .filter(([k,v])=>!skip.has(k)&&typeof v!=="object"&&v!==null&&v!==undefined)
    .sort((a,b)=>{
      const ta=typeof a[1],tb=typeof b[1];
      if(ta===tb)return a[0].localeCompare(b[0]);
      if(ta==="number")return -1; if(tb==="number")return 1; return 0;
    });

  const rawRows = entries.map(([k,v])=>{
    let col="var(--txt)", disp=String(v);
    if(typeof v==="number"){col="var(--acc)"; disp=Number(v).toLocaleString("vi-VN");}
    else if(typeof v==="boolean"){col=v?"var(--grn)":"var(--txt-m)"; disp=v?"✅ Có":"❌ Không";}
    else if(v==="")disp="—";
    return `<div class="raw-row"><span class="raw-key">${esc(k)}</span><span class="raw-val" style="color:${col}">${esc(disp)}</span></div>`;
  }).join("");

  document.getElementById("detail-content").innerHTML = `
    <div class="detail-hdr">
      <div class="detail-ident">
        <div class="detail-av">${user.charAt(0).toUpperCase()}</div>
        <div>
          <div class="detail-uname">${user}${on?'<span class="online-dot"></span>':""}</div>
          <div class="detail-sub">${dname!==user?dname+" · ":""}${SEA[sea]||"Sea "+sea} · ${race}</div>
          <div style="margin-top:6px;font-size:18px">${fi(fruit)} <span style="font-size:13px;font-weight:600">${esc(fruit)}</span></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <button class="close-btn" onclick="closeDetail()">✕</button>
        <div class="detail-lv"><div class="detail-lv-num">${lv}</div><div class="detail-lv-lbl">LEVEL</div></div>
      </div>
    </div>

    <div class="dsec">
      <div class="dsec-t">📊 Stat Allocation — tổng ${totalSt===1?0:totalSt} điểm</div>
      ${statRows}
      <div style="height:6px;background:var(--bg3);border-radius:3px;margin-top:10px;overflow:hidden">
        <div style="height:100%;width:${lvPct}%;background:linear-gradient(90deg,var(--pur),var(--acc));border-radius:3px"></div>
      </div>
      <div style="font-size:10px;color:var(--txt-m);margin-top:4px">Level ${lv} / ${MAX_LV} (${lvPct}%)</div>
    </div>

    <div class="dsec">
      <div class="dsec-t">💰 Tài Nguyên</div>
      <div class="cur-grid">
        <div class="ci"><div class="ca" style="color:var(--yel)">${fmt(beli)}</div><div class="cl">💰 Beli</div></div>
        <div class="ci"><div class="ca" style="color:var(--acc)">${fmt(frag)}</div><div class="cl">💜 Fragment</div></div>
        <div class="ci"><div class="ca" style="color:${c3rd?"var(--blu)":"var(--grn)"}">${fmt(c3rd?honor:bnty)}</div><div class="cl">${c3rd?"⚔️ Honor":"🏴 Bounty"}</div></div>
      </div>
    </div>

    ${entries.length>0?`
    <div class="dsec">
      <div class="dsec-t">📦 Tất Cả Data (${entries.length} mục)</div>
      <div class="raw-grid">${rawRows}</div>
    </div>`:""}

    <div class="dsec" style="font-size:11px;color:var(--txt-m);text-align:center">
      🕐 Cập nhật: ${ago(acc.last_updated)}
    </div>`;

  document.getElementById("detail-modal").classList.add("open");
}

function closeDetail() { document.getElementById("detail-modal").classList.remove("open"); }

// ── DELETE ──
function openDel(key,name){_delKey=key;document.getElementById("del-name").textContent=name;document.getElementById("del-key").value="";document.getElementById("del-modal").classList.add("open");}
function closeDel(){document.getElementById("del-modal").classList.remove("open");_delKey=null;}
async function doDelete(){
  const k=document.getElementById("del-key").value.trim();
  if(!k){toast("⚠️ Nhập API Secret");return;}
  try{
    const r=await fetch("/api/delete",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:k,account_key:_delKey})});
    if(r.ok){toast("✅ Đã xóa");closeDel();load();}
    else{const e=await r.json();toast("❌ "+(e.error||"Lỗi"));}
  }catch{toast("❌ Lỗi kết nối");}
}

// ── RENDER ──
function render(accounts){
  allAccounts=accounts;
  document.getElementById("cnt-lbl").textContent=accounts.length+" acc";
  document.getElementById("s-total").textContent=accounts.length;
  document.getElementById("s-online").textContent=accounts.filter(a=>isOnline(a.last_updated)).length;
  document.getElementById("s-maxlv").textContent=accounts.reduce((m,a)=>Math.max(m,getLevel(a)),0);
  document.getElementById("s-beli").textContent=fmt(accounts.reduce((s,a)=>s+g(a,"beli","Beli"),0));
  document.getElementById("s-frag").textContent=fmt(accounts.reduce((s,a)=>s+g(a,"fragments","Fragments"),0));

  const c=document.getElementById("container");
  if(!accounts.length){
    c.innerHTML=`<div class="empty"><div class="empty-ic">🍎</div><div class="empty-t">Chưa có account nào</div><p>Chạy Lua script trong game để bắt đầu tracking.</p></div>`;
    return;
  }
  c.innerHTML=`<div class="grid">${accounts.map(card).join("")}</div>`;
}

// ── FETCH ──
async function load(){
  try{
    const r=await fetch("/api/accounts");
    if(!r.ok)throw new Error(r.status);
    render(await r.json());
    document.getElementById("lastSync").textContent="Cập nhật: "+new Date().toLocaleTimeString("vi-VN");
  }catch{document.getElementById("lastSync").textContent="❌ Lỗi kết nối";}
}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000);}

load();
setInterval(load,30000);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDetail();closeDel();}});
</script>
</body>
</html>

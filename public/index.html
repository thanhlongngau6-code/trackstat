<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ThlongPremium — Account Intelligence</title>
<style>
:root{--bg:#0b0c16;--bg2:#0e0f1a;--card:#13131f;--cb:rgba(255,255,255,0.06);--cbh:rgba(255,255,255,0.13);
--on:#10b981;--on-bg:rgba(16,185,129,0.12);--on-bd:rgba(16,185,129,0.28);
--off:#6b7280;--off-bg:rgba(107,114,128,0.1);--off-bd:rgba(107,114,128,0.2);
--txt:#f1f5f9;--txt-d:#94a3b8;--txt-m:#4b5563;--teal:#34d399;--div:rgba(255,255,255,0.05);--box:#0d0e19;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
/* HEADER */
.hdr{background:var(--bg2);border-bottom:1px solid var(--div);padding:11px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50;}
.hdr-logo{display:flex;align-items:center;gap:10px;}
.hdr-icon{width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#1e40af,#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.hdr-name{font-size:14px;font-weight:700;}
.hdr-sub{font-size:10px;color:var(--txt-d);}
.hdr-mid{display:flex;align-items:center;gap:8px;}
.hcount{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
  font-size:12px;color:var(--txt-d);}
.rt{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:16px;
  background:var(--on-bg);border:1px solid var(--on-bd);font-size:11px;font-weight:600;color:var(--on);}
.rt-dot{width:5px;height:5px;border-radius:50%;background:var(--on);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* MAIN */
.main{max-width:760px;margin:0 auto;padding:18px 14px;}
.hero{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.live-lbl{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  letter-spacing:1px;color:var(--teal);text-transform:uppercase;margin-bottom:4px;}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;}
.h1{font-size:20px;font-weight:800;color:var(--txt);}
.hsub{font-size:11px;color:var(--txt-d);text-align:right;max-width:150px;line-height:1.5;}
/* CONTROLS */
.ctrls{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.srch{position:relative;}
.srch input{width:100%;background:var(--card);border:1px solid var(--cb);border-radius:10px;
  padding:9px 13px 9px 34px;color:var(--txt);font-size:13px;outline:none;transition:border .15s;}
.srch input:focus{border-color:rgba(52,211,153,0.35);}
.srch input::placeholder{color:var(--txt-m);}
.srch-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt-m);pointer-events:none;font-size:13px;}
.frow{display:flex;gap:5px;overflow-x:auto;}
.frow::-webkit-scrollbar{display:none;}
.fb{flex-shrink:0;padding:5px 12px;border-radius:7px;border:1px solid var(--cb);
  background:transparent;color:var(--txt-d);font-size:11px;font-weight:500;cursor:pointer;
  transition:all .15s;white-space:nowrap;}
.fb:hover{background:rgba(255,255,255,0.05);color:var(--txt);}
.fb.on{background:var(--txt);color:#0b0c16;border-color:var(--txt);font-weight:700;}
.sort-btn{margin-left:auto;flex-shrink:0;padding:5px 11px;border-radius:7px;
  border:1px solid var(--cb);background:transparent;color:var(--txt-d);font-size:11px;cursor:pointer;}
/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
@media(max-width:480px){.grid{grid-template-columns:1fr;}}
/* CARD */
.card{background:var(--card);border:1px solid var(--cb);border-radius:13px;
  overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;}
.card:hover{border-color:var(--cbh);transform:translateY(-1px);}
/* card head */
.ch{padding:11px 11px 9px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.avw{position:relative;flex-shrink:0;}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block;
  background:linear-gradient(135deg,#1e3a5f,#2d1b69);}
.av-fb{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#2d1b69);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;}
.avd{position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;border:2px solid var(--card);}
.avd.on{background:var(--on);}
.avd.off{background:var(--off);}
.ci{flex:1;min-width:0;}
.cu{font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cd{font-size:10px;color:var(--txt-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sbadge{flex-shrink:0;display:flex;align-items:center;gap:3px;padding:3px 7px;
  border-radius:16px;font-size:9px;font-weight:700;letter-spacing:.3px;}
.sbadge.on{background:var(--on-bg);border:1px solid var(--on-bd);color:var(--on);}
.sbadge.off{background:var(--off-bg);border:1px solid var(--off-bd);color:var(--off);}
/* divider */
.hline{height:1px;background:var(--div);margin:0 11px;}
/* stats */
.cs{padding:9px 11px 7px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.slbl{font-size:8px;font-weight:600;color:var(--txt-m);text-transform:uppercase;letter-spacing:.4px;
  display:flex;align-items:center;gap:2px;margin-bottom:2px;}
.sval{font-size:18px;font-weight:800;line-height:1;}
.sval.w{color:var(--txt);}
.sval.t{color:var(--teal);}
/* items */
.ci2{padding:0 11px 7px;display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.il{font-size:8px;color:var(--txt-m);display:flex;align-items:center;gap:2px;margin-bottom:1px;}
.iv{font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iv.m{color:var(--txt-d);}
/* footer */
.cf{padding:7px 11px;display:flex;align-items:center;justify-content:space-between;}
.upd{font-size:9px;color:var(--txt-m);display:flex;align-items:center;gap:3px;}
.upt{font-size:9px;font-weight:600;color:var(--txt-d);}
.upt.live{color:var(--teal);}
/* EMPTY / LOADER */
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--txt-d);}
.loader{grid-column:1/-1;text-align:center;padding:50px;}
.spin{width:24px;height:24px;border:2px solid rgba(255,255,255,0.08);border-top-color:var(--teal);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
/* DETAIL OVERLAY */
.ov{display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);
  align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.detail{background:#12121e;border:1px solid rgba(255,255,255,0.09);
  border-radius:18px 18px 0 0;width:100%;max-width:600px;
  max-height:92vh;overflow-y:auto;position:relative;}
.detail::-webkit-scrollbar{width:3px;}
.detail::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
/* detail header */
.dt{padding:18px 18px 0;}
.dpl{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--teal);
  text-transform:uppercase;margin-bottom:12px;}
.dident{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px;}
.daw{position:relative;flex-shrink:0;}
.dav{width:64px;height:64px;border-radius:50%;object-fit:cover;
  background:linear-gradient(135deg,#1e3a5f,#2d1b69);display:block;}
.dav-fb{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#2d1b69);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;}
.dad{position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;border:2.5px solid #12121e;}
.dad.on{background:var(--on);}
.dad.off{background:var(--off);}
.dun{font-size:19px;font-weight:800;color:var(--txt);margin-bottom:1px;}
.ddn{font-size:12px;color:var(--txt-d);margin-bottom:7px;}
.dcl{position:absolute;top:14px;right:14px;width:27px;height:27px;border-radius:50%;
  background:rgba(255,255,255,0.06);border:none;color:var(--txt-d);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:.15s;}
.dcl:hover{background:rgba(255,255,255,0.1);color:var(--txt);}
/* detail boxes */
.dboxes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px;}
.dbox{background:var(--box);border:1px solid rgba(255,255,255,0.04);border-radius:9px;padding:9px 11px;}
.dbl{font-size:8px;color:var(--txt-m);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.dbv{font-size:15px;font-weight:800;color:var(--txt);}
/* detail sections */
.dsec{padding:12px 18px;border-top:1px solid var(--div);}
.dst{font-size:10px;font-weight:700;color:var(--txt-d);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px;}
.d2c{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.drow{display:flex;align-items:center;justify-content:space-between;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,0.03);}
.drow:last-child{border-bottom:none;}
.drk{font-size:11px;color:var(--txt-m);display:flex;align-items:center;gap:5px;}
.drv{font-size:11px;color:var(--txt);font-weight:500;display:flex;align-items:center;gap:4px;max-width:50%;text-align:right;word-break:break-all;}
.drv.m{color:var(--txt-d);}
.cpbtn{background:none;border:none;color:var(--txt-m);cursor:pointer;font-size:10px;
  padding:1px 3px;border-radius:3px;flex-shrink:0;}
.cpbtn:hover{background:rgba(255,255,255,0.06);color:var(--txt);}
/* items table */
.itlist{display:flex;flex-direction:column;gap:1px;}
.itempty{font-size:11px;color:var(--txt-m);}
.itrow{display:flex;align-items:center;justify-content:space-between;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,0.03);}
.itrow:last-child{border-bottom:none;}
.itn{font-size:11px;color:var(--txt);}
.itq{font-size:11px;color:var(--txt-d);font-weight:600;background:rgba(255,255,255,0.05);
  padding:1px 7px;border-radius:4px;}
/* timestamps */
.dts{padding:10px 18px;border-top:1px solid var(--div);display:flex;flex-wrap:wrap;gap:10px;}
.tsi{font-size:10px;color:var(--txt-m);}
.tsi span{color:var(--txt-d);}
/* toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(6px);
  background:#1a1a2a;border:1px solid rgba(255,255,255,0.1);border-radius:9px;
  padding:9px 16px;font-size:12px;color:var(--txt);
  opacity:0;transition:all .22s;z-index:300;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-logo">
    <div class="hdr-icon">⬡</div>
    <div>
      <div class="hdr-name">ThlongPremium</div>
      <div class="hdr-sub">Account intelligence</div>
    </div>
  </div>
  <div class="hdr-mid">
    <div class="hcount">👤 <span id="h-total">0</span></div>
    <div class="hcount">📶 <span id="h-online">0</span></div>
    <div class="hcount">○ <span id="h-offline">0</span></div>
  </div>
  <div class="rt"><div class="rt-dot"></div>Realtime connected</div>
</header>

<main class="main">
  <div class="hero">
    <div>
      <div class="live-lbl"><div class="ldot"></div>LIVE FLEET</div>
      <div class="h1">Account overview</div>
    </div>
    <div class="hsub">Every player signal, one clear view.</div>
  </div>

  <div class="ctrls">
    <div class="srch">
      <span class="srch-ic">🔍</span>
      <input id="search" placeholder="Search username, display name or UserId" oninput="applyFilter()"/>
    </div>
    <div class="frow">
      <button class="fb on" onclick="setFilter('all',this)">All</button>
      <button class="fb" onclick="setFilter('online',this)">Online</button>
      <button class="fb" onclick="setFilter('offline',this)">Offline</button>
      <button class="fb" onclick="setFilter('sea1',this)">Sea 1</button>
      <button class="fb" onclick="setFilter('sea2',this)">Sea 2</button>
      <button class="fb" onclick="setFilter('sea3',this)">Sea 3</button>
      <button class="sort-btn" onclick="toggleSort()">⊟ <span id="sort-lbl">Last update</span></button>
    </div>
  </div>

  <div class="grid" id="grid">
    <div class="loader"><div class="spin"></div></div>
  </div>
</main>

<!-- DETAIL OVERLAY -->
<div class="ov" id="ov" onclick="if(event.target===this)closeDetail()">
  <div class="detail" id="det"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = n => {
    n = Number(n)||0;
    if(n>=1e9)return(n/1e9).toFixed(1)+'B';
    if(n>=1e6)return(n/1e6).toFixed(1)+'M';
    if(n>=1e3)return(n/1e3).toFixed(1)+'K';
    return n.toLocaleString();
};
const fmtFull = n => (Number(n)||0).toLocaleString();
const isOnline = iso => iso && (Date.now()-new Date(iso).getTime()) < 3*60*1000;
const ago = iso => {
    if(!iso)return'—';
    const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
    if(s<5)return'Just now';
    if(s<60)return s+'s ago';
    const m=Math.floor(s/60);
    if(m<60)return m+'m ago';
    return Math.floor(m/60)+'h ago';
};
const uptime = acc => {
    if(!acc.session_start||!isOnline(acc.last_updated))return null;
    const s=Math.floor((Date.now()-new Date(acc.session_start).getTime())/1000);
    if(s<0)return null;
    const m=Math.floor(s/60);
    return m>0?`Up ${m}m ${s%60}s`:`Up ${s}s`;
};
const tsFormat = iso => {
    if(!iso)return'—';
    return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
};
const g  = (o,...k)=>{for(const x of k){const v=o?.[x];if(v!==undefined&&v!==null)return Number(v)||0;}return 0;};
const gs = (o,...k)=>{for(const x of k){const v=o?.[x];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v);}return'';};

const FRUIT_IC = {flame:'🔥',ice:'🧊',magma:'🌋',light:'✨',dark:'🌑',buddha:'🧘',phoenix:'🔴',
  rumble:'⚡',dragon:'🐉',leopard:'🐆',kitsune:'🦊',shadow:'🌙',dough:'🫓',spirit:'👻',
  string:'🕸️',quake:'💥',paw:'🐾',gravity:'🌀',venom:'☠️',mammoth:'🦣',control:'🎮',
  blizzard:'❄️',portal:'🔮',smoke:'💨',diamond:'💎',rubber:'🏐',barrier:'🛡️',
  revive:'💚',sand:'🏜️',bird:'🦤',love:'❤️',spike:'🌵',rocket:'🚀',bomb:'💣','t-rex':'🦖'};

function fruitIc(f){
    if(!f||f==='None'||f==='—')return'—';
    const n=f.toLowerCase();
    for(const[k,v]of Object.entries(FRUIT_IC))if(n.includes(k))return v+' '+f;
    return'🍎 '+f;
}

function getLevel(acc){
    let lv=Number(acc.level||0);
    if(lv>1)return lv;
    const raw=acc.raw_dump||{};
    for(const[k,v]of Object.entries(raw)){
        if(k.toLowerCase()==='level'&&Number(v)>lv)lv=Number(v);
    }
    return lv;
}

function avatarEl(userId,size,cls){
    const s=size||36;
    return `<img class="${cls||'av'}" 
        src="/api/avatar?id=${userId}" 
        width="${s}" height="${s}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        style="border-radius:50%;object-fit:cover;">`;
}

let allAcc=[], activeFilter='all', sortMode='time', searchQ='';

function setFilter(f,btn){
    activeFilter=f;
    document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    applyFilter();
}

function toggleSort(){
    sortMode = sortMode==='time'?'level':'time';
    document.getElementById('sort-lbl').textContent = sortMode==='time'?'Last update':'Level';
    applyFilter();
}

function applyFilter(){
    searchQ = document.getElementById('search').value.toLowerCase();
    let list = allAcc.filter(a=>{
        const on = isOnline(a.last_updated);
        const sea = g(a,'sea','Sea');
        if(activeFilter==='online'  && !on) return false;
        if(activeFilter==='offline' && on)  return false;
        if(activeFilter==='sea1'    && sea!==1) return false;
        if(activeFilter==='sea2'    && sea!==2) return false;
        if(activeFilter==='sea3'    && sea!==3) return false;
        if(searchQ){
            const u=(gs(a,'username','Username')+gs(a,'display_name','displayName')+String(a.user_id||'')).toLowerCase();
            if(!u.includes(searchQ))return false;
        }
        return true;
    });
    if(sortMode==='level') list.sort((a,b)=>getLevel(b)-getLevel(a));
    else list.sort((a,b)=>new Date(b.last_updated||0)-new Date(a.last_updated||0));
    renderGrid(list);
}

function renderGrid(list){
    const g=document.getElementById('grid');
    const on=allAcc.filter(a=>isOnline(a.last_updated)).length;
    document.getElementById('h-total').textContent=allAcc.length;
    document.getElementById('h-online').textContent=on;
    document.getElementById('h-offline').textContent=allAcc.length-on;

    if(!list.length){
        g.innerHTML='<div class="empty">Không có account nào phù hợp.</div>';
        return;
    }
    g.innerHTML=list.map(card).join('');
}

function card(acc){
    const user = gs(acc,'username','Username')||'???';
    const dname= gs(acc,'display_name','displayName')||user;
    const uid  = gs(acc,'user_id','userId');
    const lv   = getLevel(acc);
    const beli = g(acc,'beli','Beli');
    const frag = g(acc,'fragments','Fragments');
    const sea  = g(acc,'sea','Sea')||1;
    const race = gs(acc,'race','Race')||'—';
    const fruit= gs(acc,'devil_fruit','DevilFruit')||'None';
    const sword= gs(acc,'sword_name','SwordType','CurrentSword')||(acc.raw_dump&&gs(acc.raw_dump,'SwordType','CurrentSword'))||'—';
    const on   = isOnline(acc.last_updated);
    const ut   = uptime(acc);
    const key  = esc(acc.account_key||user);
    const fi   = fruit==='None'||fruit===''?'—':(FRUIT_IC[fruit.toLowerCase().split('-')[0]]||'🍎')+' '+fruit;

    return `<div class="card" onclick="openDetail('${key}')">
  <div class="ch">
    <div class="avw">
      ${uid?avatarEl(uid,36,'av'):''}
      <div class="av-fb" ${uid?'style="display:none"':''}>${esc(user[0]||'?').toUpperCase()}</div>
      <div class="avd ${on?'on':'off'}"></div>
    </div>
    <div class="ci">
      <div class="cu">${esc(user)}</div>
      <div class="cd">${esc(dname)}</div>
    </div>
    <div class="sbadge ${on?'on':'off'}">⬡ ${on?'ONLINE':'OFFLINE'}</div>
  </div>
  <div class="hline"></div>
  <div class="cs">
    <div>
      <div class="slbl">📶 Level</div>
      <div class="sval w">${lv||'—'}</div>
    </div>
    <div>
      <div class="slbl">💰 Beli</div>
      <div class="sval t">${fmt(beli)}</div>
    </div>
    <div>
      <div class="slbl">💜 Fragments</div>
      <div class="sval w">${fmt(frag)}</div>
    </div>
  </div>
  <div class="hline"></div>
  <div class="ci2">
    <div>
      <div class="il">🍎 Fruit</div>
      <div class="iv ${fruit==='None'||!fruit?'m':''}">${fi}</div>
    </div>
    <div>
      <div class="il">⚔ Sword</div>
      <div class="iv ${!sword||sword==='—'?'m':''}">${esc(sword)||'—'}</div>
    </div>
    <div>
      <div class="il">⭕ Race</div>
      <div class="iv">${esc(race)||'—'}</div>
    </div>
    <div>
      <div class="il">🌊 Sea</div>
      <div class="iv">${sea===1?'Sea 1':sea===2?'Sea 2':sea===3?'Sea 3':'Sea '+sea}</div>
    </div>
  </div>
  <div class="hline"></div>
  <div class="cf">
    <div class="upd">⏱ Updated ${ago(acc.last_updated)}</div>
    <div class="upt ${on&&ut?'live':''}">${on&&ut?ut:'Not active'}</div>
  </div>
</div>`;
}

function openDetail(key){
    const acc=allAcc.find(a=>(a.account_key||'')=== key);
    if(!acc)return;

    const user  = gs(acc,'username','Username')||'???';
    const dname = gs(acc,'display_name','displayName')||user;
    const uid   = gs(acc,'user_id','userId');
    const lv    = getLevel(acc);
    const beli  = g(acc,'beli','Beli');
    const frag  = g(acc,'fragments','Fragments');
    const sea   = g(acc,'sea','Sea')||1;
    const race  = gs(acc,'race','Race')||'—';
    const fruit = gs(acc,'devil_fruit','DevilFruit')||'None';
    const style = gs(acc,'fighting_style','FightingStyle')||'—';
    const sword = gs(acc,'sword_name','SwordType','CurrentSword')||'—';
    const gun   = gs(acc,'GunName','CurrentGun')||'—';
    const on    = isOnline(acc.last_updated);
    const ut    = uptime(acc);
    const placeId=gs(acc,'place_id')||'—';
    const jobId  =gs(acc,'job_id')||'—';
    const seaStr = sea===1?'Sea 1':sea===2?'Sea 2':sea===3?'Sea 3':'Sea '+sea;

    // Online time
    let onlineTime='—';
    if(on&&acc.session_start){
        const s=Math.floor((Date.now()-new Date(acc.session_start).getTime())/1000);
        const m=Math.floor(s/60);
        onlineTime=m>0?`${m}m ${s%60}s`:`${s}s`;
    }

    // Important items from raw_dump
    const raw=acc.raw_dump||{};
    const importantKeys=['DevilFruit','FruitName','SwordType','CurrentSword','FightingStyle','Style',
        'Kairun','Godhuman','Saber','Yama','Tushita','Pole','Bisento','Dragon','Rengoku'];
    const items=[];
    if(fruit&&fruit!=='None'&&fruit!=='')items.push({name:'Devil Fruit: '+fruit,qty:''});
    if(style&&style!=='—'&&style!=='')items.push({name:'Fighting Style: '+style,qty:''});
    if(sword&&sword!=='—'&&sword!=='')items.push({name:'Sword: '+sword,qty:''});
    // Scan raw for numeric > 0 with known item names
    for(const[k,v]of Object.entries(raw)){
        if(typeof v==='number'&&v>0&&v<10000){
            const kl=k.toLowerCase();
            if(kl.includes('saber')||kl.includes('yama')||kl.includes('tushita')||
               kl.includes('pole')||kl.includes('bisento')||kl.includes('rengoku')||
               kl.includes('kairun')||kl.includes('task')){
                items.push({name:k,qty:String(v)});
            }
        }
        if(typeof v==='boolean'&&v){
            const kl=k.toLowerCase();
            if(kl.includes('kairun')||kl.includes('task')||kl.includes('godhuman'))
                items.push({name:k,qty:'✓'});
        }
    }

    const itemsHtml = items.length
        ? `<div class="itlist">${items.map(i=>`<div class="itrow"><span class="itn">${esc(i.name)}</span>${i.qty?`<span class="itq">${esc(i.qty)}</span>`:''}</div>`).join('')}</div>`
        : `<div class="itempty">No items reported</div>`;

    const truncate = s => s.length>22?s.slice(0,22)+'...':s;

    document.getElementById('det').innerHTML=`
<div style="position:relative;">
<button class="dcl" onclick="closeDetail()">✕</button>
<div class="dt">
  <div class="dpl">Account Profile</div>
  <div class="dident">
    <div class="daw">
      ${uid?`<img class="dav" src="/api/avatar?id=${uid}" width="64" height="64"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:'' }
      <div class="dav-fb" ${uid?'style="display:none"':''}>${esc(user[0]||'?').toUpperCase()}</div>
      <div class="dad ${on?'on':'off'}"></div>
    </div>
    <div>
      <div class="dun">${esc(user)}</div>
      <div class="ddn">${esc(dname)}</div>
      <div class="sbadge ${on?'on':'off'}" style="display:inline-flex">⬡ ${on?'ONLINE':'OFFLINE'}</div>
    </div>
  </div>
  <div class="dboxes">
    <div class="dbox"><div class="dbl">Level</div><div class="dbv">${lv||'—'}</div></div>
    <div class="dbox"><div class="dbl">Beli</div><div class="dbv" style="color:var(--teal)">${fmtFull(beli)}</div></div>
    <div class="dbox"><div class="dbl">Fragments</div><div class="dbv">${fmtFull(frag)}</div></div>
    <div class="dbox"><div class="dbl">Online time</div><div class="dbv" style="font-size:13px">${onlineTime}</div></div>
  </div>
</div>
<div class="dsec">
  <div class="d2c">
    <div>
      <div class="dst">Identity &amp; Location</div>
      <div class="drow">
        <span class="drk"># User ID</span>
        <span class="drv">${esc(uid||'—')}<button class="cpbtn" onclick="cp('${esc(uid||'')}')">⧉</button></span>
      </div>
      <div class="drow">
        <span class="drk">👤 Username</span>
        <span class="drv">${esc(user)}<button class="cpbtn" onclick="cp('${esc(user)}')">⧉</button></span>
      </div>
      <div class="drow">
        <span class="drk">📍 Place ID</span>
        <span class="drv">${esc(placeId)}<button class="cpbtn" onclick="cp('${esc(placeId)}')">⧉</button></span>
      </div>
      <div class="drow">
        <span class="drk">📋 Job ID</span>
        <span class="drv" title="${esc(jobId)}">${esc(truncate(jobId))}<button class="cpbtn" onclick="cp('${esc(jobId)}')">⧉</button></span>
      </div>
      <div class="drow">
        <span class="drk">Current sea</span>
        <span class="drv">${esc(seaStr)}</span>
      </div>
    </div>
    <div>
      <div class="dst">Loadout</div>
      <div class="drow"><span class="drk">Race</span><span class="drv ${!race||race==='—'?'m':''}">${esc(race)}</span></div>
      <div class="drow"><span class="drk">Fighting style</span><span class="drv ${!style||style==='—'?'m':''}">${esc(style)}</span></div>
      <div class="drow"><span class="drk">Fruit</span><span class="drv ${fruit==='None'||!fruit?'m':''}">${esc(fruit==='None'||!fruit?'—':fruit)}</span></div>
      <div class="drow"><span class="drk">Sword</span><span class="drv ${!sword||sword==='—'?'m':''}">${esc(sword)}</span></div>
      <div class="drow"><span class="drk">Gun</span><span class="drv ${!gun||gun==='—'?'m':''}">${esc(gun)}</span></div>
    </div>
  </div>
</div>
<div class="dsec">
  <div class="dst">Accessories</div>
  <div class="itempty">No accessories reported</div>
</div>
<div class="dsec">
  <div class="dst">Important Items</div>
  ${itemsHtml}
</div>
<div class="dts">
  <div class="tsi">First seen: <span>${tsFormat(acc.first_seen)}</span></div>
  <div class="tsi">Last seen: <span>${tsFormat(acc.last_updated)}</span></div>
  <div class="tsi">Updated: <span>${tsFormat(acc.last_updated)}</span></div>
</div>
</div>`;

    document.getElementById('ov').classList.add('open');
}

function closeDetail(){document.getElementById('ov').classList.remove('open');}

async function cp(text){
    try{await navigator.clipboard.writeText(text);toast('Đã copy!');}
    catch{toast('Copy thất bại');}
}

function toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
}

async function load(){
    try{
        const r=await fetch('/api/accounts');
        if(!r.ok)throw new Error(r.status);
        allAcc=await r.json();
        applyFilter();
    }catch(e){
        document.getElementById('grid').innerHTML='<div class="empty">❌ Lỗi kết nối API</div>';
    }
}

load();
setInterval(load,30000);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
</script>
</body>
</html>
